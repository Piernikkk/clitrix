[package]
name = "clitrix"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = "4.5.49"
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
matrix-sdk = { version = "0.14.0", features = ["eyre"] }
rand = "0.9.2"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
serde = "1.0.228"
toml = "0.9.8"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
